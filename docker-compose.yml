# Every container drops all Linux capabilities and cannot gain new ones; each service adds back
# only what its entrypoint needs (chown the volumes, switch to its unprivileged user).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Ports are bound to localhost only; `tailscale serve` publishes them over HTTPS on the tailnet:
  # https://$TS_HOST (app), :8181 (importer), :8282 (firefly-pico). TS_HOST is set in .env.
  app:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    image: fireflyiii/core:version-6.7.9
    container_name: firefly_iii_core
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    image: mariadb:12.3.3
    container_name: firefly_iii_db
    restart: always
    environment:
      # The same credentials as Firefly III's DB_* in .env.
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      # Upgrade system tables automatically when the MariaDB version changes.
      - MARIADB_AUTO_UPGRADE=1
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - firefly_iii_db:/var/lib/mysql

  importer:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    image: fireflyiii/data-importer:version-2.3.5
    container_name: firefly_iii_importer
    restart: always
    ports:
      - "127.0.0.1:8181:8080"
    depends_on:
      - app
    environment:
      - FIREFLY_III_URL=http://app:8080
      - FIREFLY_III_ACCESS_TOKEN=${FIREFLY_III_ACCESS_TOKEN}
      - VANITY_URL=https://${TS_HOST}
      - APP_URL=https://${TS_HOST}:8181
      - CAN_POST_AUTOIMPORT=true
      - IMPORT_DIR_ALLOWLIST=/import
      - ENABLE_MAIL_REPORT=false
      - TRUSTED_PROXIES=**
      # Enable Banking (bank sync): app ID in .env, private key from the git-ignored file below.
      - ENABLE_BANKING_APP_ID=${ENABLE_BANKING_APP_ID}
      - ENABLE_BANKING_PRIVATE_KEY=/run/secrets/enablebanking.pem
      # Nightly import: the cron service POSTs to /autoimport with the configs in ./import.
      - AUTO_IMPORT_SECRET=${AUTO_IMPORT_SECRET}
      # Re-fetched transactions already in Firefly III are skipped silently, so the e-mailed
      # report only goes out for new transactions or real errors (e.g. expired bank consent).
      - IGNORE_DUPLICATE_ERRORS=true
    volumes:
      - ./.enablebanking.pem:/run/secrets/enablebanking.pem:ro
      - ./import:/import:ro

  firefly-pico:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - KILL
    image: cioraneanu/firefly-pico:dev@sha256:acdce72b2fa43e673bfebc3fb105620bc009bcc64b7022bbeddc5e33eb872b0f
    container_name: firefly_iii_pico
    restart: always
    ports:
      - "127.0.0.1:8282:80"
    depends_on:
      - app
    environment:
      - FIREFLY_URL=http://app:8080
    volumes:
      - pico_data:/var/www/html/database/data

  # Scheduled jobs (see cron/daily.sh): bank import, PEA valuation, backup, Firefly III's daily cron.
  # STATIC_CRON_TOKEN is read from .env by Compose.
  cron:
    <<: *hardened
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    build: ./cron
    init: true
    container_name: firefly_iii_cron
    restart: always
    env_file:
      # FIREFLY_TOKEN, a personal access token for the PEA valuation.
      - path: .api.env
        required: false
    environment:
      - TZ=Europe/Paris
      - STATIC_CRON_TOKEN=${STATIC_CRON_TOKEN}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      # Off-site backup (restic); optional healthchecks.io pings and local retention in days.
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-}
      - HEALTHCHECK_URL=${HEALTHCHECK_URL:-}
      - IMPORT_HEALTHCHECK_URL=${IMPORT_HEALTHCHECK_URL:-}
      - KEEP_DAYS=${KEEP_DAYS:-14}
      - AUTO_IMPORT_SECRET=${AUTO_IMPORT_SECRET}
      - RCLONE_CONFIG=/config/rclone/rclone.conf
      - RESTIC_CACHE_DIR=/tmp/restic-cache
      - BACKUP_OWNER=1000:1000
    volumes:
      - ./backups:/backups
      - ./.rclone:/config/rclone
      - firefly_upload:/uploads:ro
      - ./patrimoine:/patrimoine:ro
    depends_on:
      - app

  # MCP server for Claude Code (see .mcp.json), started on demand with `docker compose run`.
  # The profile keeps `docker compose up` from starting it.
  assistant:
    build: ./assistant
    profiles: [assistant]
    env_file: .api.env
    # Same user as the host's, so set_pea_position can edit patrimoine/pea.txt.
    user: "1000:1000"
    environment:
      - TZ=Europe/Paris
      - FIREFLY_URL=http://app:8080
    volumes:
      - ./patrimoine:/patrimoine

volumes:
  firefly_upload:
  firefly_iii_db:
  pico_data:
