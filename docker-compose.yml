# Settings shared by every service.
# - Every container drops all Linux capabilities and cannot gain new ones; each service adds back
#   only what its entrypoint needs (chown the volumes, switch to its unprivileged user).
# - Public DNS servers: Docker's own resolver forwards to the host's, which here is Tailscale's
#   (100.100.100.100 and an IPv6 address containers cannot reach), and its lookups failed or hung
#   for minutes, which broke the Google Drive backups, the bank import and the mail. Container
#   names (app, db...) are still resolved by Docker.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  dns:
    - 1.1.1.1
    - 9.9.9.9

services:
  # Ports are bound to localhost only; `tailscale serve` publishes them over HTTPS on the tailnet:
  # https://$TS_HOST (app), :8181 (importer), :8282 (firefly-pico). TS_HOST is set in .env.
  app:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    image: fireflyiii/core:version-6.7.9
    container_name: firefly_iii_core
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    image: mariadb:12.3.3
    container_name: firefly_iii_db
    restart: always
    environment:
      # The same credentials as Firefly III's DB_* in .env.
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      # Upgrade system tables automatically when the MariaDB version changes.
      - MARIADB_AUTO_UPGRADE=1
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - firefly_iii_db:/var/lib/mysql

  importer:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    image: fireflyiii/data-importer:version-2.3.5
    container_name: firefly_iii_importer
    restart: always
    ports:
      - "127.0.0.1:8181:8080"
    depends_on:
      - app
    environment:
      - FIREFLY_III_URL=http://app:8080
      - FIREFLY_III_ACCESS_TOKEN=${FIREFLY_III_ACCESS_TOKEN}
      - VANITY_URL=https://${TS_HOST}
      - APP_URL=https://${TS_HOST}:8181
      - CAN_POST_AUTOIMPORT=true
      - IMPORT_DIR_ALLOWLIST=/import
      - ENABLE_MAIL_REPORT=false
      - TRUSTED_PROXIES=**
      # Enable Banking (bank sync): app ID in .env, private key from the git-ignored file below.
      - ENABLE_BANKING_APP_ID=${ENABLE_BANKING_APP_ID}
      - ENABLE_BANKING_PRIVATE_KEY=/run/secrets/enablebanking.pem
      # Nightly import: the cron service POSTs to /autoimport with the configs in ./import.
      - AUTO_IMPORT_SECRET=${AUTO_IMPORT_SECRET}
      # Re-fetched transactions already in Firefly III are skipped silently, so the e-mailed
      # report only goes out for new transactions or real errors (e.g. expired bank consent).
      - IGNORE_DUPLICATE_ERRORS=true
    volumes:
      - ./.enablebanking.pem:/run/secrets/enablebanking.pem:ro
      - ./import:/import:ro
      # Shared read-only with the cron service, which reads the log to tell whether an import worked.
      - importer_logs:/var/www/html/storage/logs

  firefly-pico:
    <<: *hardened
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - KILL
    image: cioraneanu/firefly-pico:dev@sha256:ccb0af41db0d652ce26408e653ffe3a58b9fc174ec4e6fdff37fc2767bf243ad
    container_name: firefly_iii_pico
    restart: always
    ports:
      - "127.0.0.1:8282:80"
    depends_on:
      - app
    environment:
      - FIREFLY_URL=http://app:8080
    volumes:
      - pico_data:/var/www/html/database/data

  # Scheduled jobs (see cron/daily.sh): bank import, PEA valuation, backup, Firefly III's daily cron.
  # STATIC_CRON_TOKEN is read from .env by Compose.
  cron:
    <<: *hardened
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    build: ./cron
    init: true
    container_name: firefly_iii_cron
    restart: always
    env_file:
      # FIREFLY_TOKEN, a personal access token for the PEA valuation.
      - path: .api.env
        required: false
    environment:
      - TZ=Europe/Paris
      - STATIC_CRON_TOKEN=${STATIC_CRON_TOKEN}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      # Optional healthchecks.io pings and local backup retention in days.
      - HEALTHCHECK_URL=${HEALTHCHECK_URL:-}
      - IMPORT_HEALTHCHECK_URL=${IMPORT_HEALTHCHECK_URL:-}
      - KEEP_DAYS=${KEEP_DAYS:-14}
      - AUTO_IMPORT_SECRET=${AUTO_IMPORT_SECRET}
      - BACKUP_OWNER=1000:1000
    volumes:
      - ./backups:/backups
      - firefly_upload:/uploads:ro
      - importer_logs:/importer-logs:ro
      - ./patrimoine:/patrimoine:ro
    depends_on:
      - app

  # MCP server for Claude Code (see .mcp.json), started on demand with `docker compose run`.
  # The profile keeps `docker compose up` from starting it.
  assistant:
    build: ./assistant
    profiles: [assistant]
    env_file: .api.env
    # Same user as the host's, so set_pea_position can edit patrimoine/pea.txt.
    user: "1000:1000"
    environment:
      - TZ=Europe/Paris
      - FIREFLY_URL=http://app:8080
    volumes:
      - ./patrimoine:/patrimoine

  # Same MCP server over HTTP, for clients outside this machine. Reachable on the tailnet only:
  #   tailscale serve --bg --https=8383 http://127.0.0.1:8383   -> https://$TS_HOST:8383/mcp
  # Same tools as the stdio one, writes included: the tailnet is the only protection.
  assistant-http:
    build: ./assistant
    restart: unless-stopped
    depends_on: [app]
    env_file: .api.env
    user: "1000:1000"
    environment:
      - TZ=Europe/Paris
      - FIREFLY_URL=http://app:8080
      - MCP_TRANSPORT=http
      - TS_HOST=${TS_HOST}
    ports:
      - "127.0.0.1:8383:8383"
    volumes:
      - ./patrimoine:/patrimoine

  # Dashboard (income, spending, saving, net worth, projections). Reads Firefly III; it only writes piggy banks (tirelires), through the Firefly III API. Reachable on the tailnet only:
  #   tailscale serve --bg --https=8787 http://127.0.0.1:8787   -> https://$TS_HOST:8787
  dashboard:
    <<: *hardened
    build: ./dashboard
    restart: unless-stopped
    depends_on: [app]
    env_file: .api.env
    user: "1000:1000"
    environment:
      - TZ=Europe/Paris
      - FIREFLY_URL=http://app:8080
      - DASHBOARD_ALLOWED_HOSTS=${TS_HOST}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./patrimoine:/patrimoine:ro

volumes:
  importer_logs:
  firefly_upload:
  firefly_iii_db:
  pico_data:
